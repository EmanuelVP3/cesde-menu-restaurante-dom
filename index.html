<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú de restaurante</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="menu-app">
    <h1>Menú de restaurante</h1>
    <p>Base pendiente de implementar por el equipo.</p>
    <!-- Compañero 1: conservar estos identificadores al completar el diseño. -->
    <form id="form-plato">
      <label for="nombre-plato">Nombre del plato</label>
      <input id="nombre-plato" name="nombre" required>
      <label for="precio-plato">Precio</label>
      <input id="precio-plato" name="precio" type="number" min="0.01" step="0.01" required>
      <button type="submit" disabled>Agregar (pendiente)</button>
    </form>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <section aria-labelledby="titulo-menu">
      <h2 id="titulo-menu">Platos</h2>
      <div id="lista-platos"></div>
    </section>
    <section aria-labelledby="titulo-pedido">
      <h2 id="titulo-pedido">Pedido</h2>
      <ul id="lista-pedido"></ul>
    </section>
  </main>
</body>
</html>
